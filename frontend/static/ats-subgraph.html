<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subgraph — INV (200 nodes)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0f1117; color: #e0e0e0; height: 100vh; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; }
  .link-link    { stroke: #7eb8f7; stroke-opacity: 0.8; }
  .link-related { stroke: #f7b67e; stroke-opacity: 0.35; stroke-dasharray: 4 3; }
  .node circle  { stroke-width: 1.5; cursor: pointer; }
  .node.seed circle { stroke-width: 3; stroke: #fff; }
  .node text {
    font-size: 10px; fill: #ccc; pointer-events: none;
    text-shadow: 0 0 3px #0f1117, 0 0 3px #0f1117;
    opacity: 0; transition: opacity 0.1s;
  }
  .node.seed text { font-weight: 700; fill: #fff; font-size: 11px; }
  .node:hover text { opacity: 1; }
  #tooltip {
    position: fixed; padding: 10px 13px; background: rgba(20,22,30,0.95);
    border: 1px solid #444; border-radius: 6px; font-size: 12px; line-height: 1.5;
    max-width: 360px; pointer-events: none; display: none; z-index: 9;
    white-space: pre-wrap; word-break: break-word;
  }
  #tooltip strong { color: #7eb8f7; }
  #controls {
    position: fixed; top: 14px; left: 14px; background: rgba(20,22,30,0.92);
    border: 1px solid #333; border-radius: 8px; padding: 14px 18px;
    font-size: 12px; min-width: 220px; z-index: 10;
  }
  #controls h3 { font-size: 13px; margin-bottom: 10px; color: #7eb8f7; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.seed { border: 2.5px solid #fff; }
  .divider { border: none; border-top: 1px solid #333; margin: 10px 0; }
  label { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; color: #bbb; }
  input[type=range] { width: 100%; accent-color: #7eb8f7; }
  .stat { color: #888; margin-top: 8px; font-size: 11px; }
  .stat span { color: #ccc; }
  #edge-counts { margin-top: 4px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<svg id="canvas"></svg>
<div id="tooltip"></div>
<div id="controls">
  <h3>ATS Subgraph</h3>
  <div class="legend-row"><div class="legend-dot" style="background:#5b9cf6"></div>SORN</div>
  <div class="legend-row"><div class="legend-dot" style="background:#f6955b"></div>PRA ICR</div>
  <div class="legend-row"><div class="legend-dot" style="background:#5bf685"></div>AI Inventory</div>
  <hr class="divider">
  <div class="legend-row"><div style="width:24px;height:2px;background:#7eb8f7;flex-shrink:0"></div>Same system (link)</div>
  <div class="legend-row"><div style="width:24px;height:2px;background:#f7b67e;flex-shrink:0;border-top:1px dashed #f7b67e"></div>Data dependency</div>
  <div class="legend-row">
    <div class="legend-dot seed" style="background:#5b9cf6;width:14px;height:14px"></div>
    Seed record
  </div>
  <hr class="divider">
  <label>
    Min similarity: <span id="sim-val">0.60</span>
    <input type="range" id="sim-slider" min="0" max="1" step="0.01" value="0.60">
  </label>
  <label style="margin-top:8px;flex-direction:row;align-items:center;gap:6px;">
    <input type="checkbox" id="hide-related"> Hide dependency edges
  </label>
  <div id="edge-counts"></div>
  <div class="stat">Nodes: <span id="stat-nodes">200</span></div>
  <div class="stat">Seeds: <span id="stat-seeds">11</span></div>
</div>

, "target": "inv:DHS-183", "edge_type": "related", "similarity": 0.5775366249415372, "explanation": "Record A is a FEMA/PRA filing for a state preparedness reporting tool used to collect and standardize emergency preparedness information for THIRA/SPR assessments, while Record B is a DHS/CBP AI use case for compiling publicly available information to identify possible threats related to travel and "}, {"source": "pra:202010-1651-002", "target": "inv:DHS-2364", "edge_type": "related", "similarity": 0.6524805221781186, "explanation": "Record A describes CBP\u2019s Automated Commercial Environment (ACE), the trade-processing and risk-management backbone used to collect, maintain, and share import/export records. Record B describes an AI use case for anomaly detection models that operate on CBP systems to analyze NII images for passenge"}, {"source": "pra:201909-1651-003", "target": "inv:DHS-2364", "edge_type": "related", "similarity": 0.6524606417336793, "explanation": "The records do not name the same system: Record A is the Automated Commercial Environment (ACE), a trade-processing and data-sharing platform, while Record B is an AI use case for anomaly detection on cargo/vehicle images. On subject and function, they are distinct: ACE collects and routes import/co"}, {"source": "pra:202210-1651-007", "target": "inv:DHS-2364", "edge_type": "related", "similarity": 0.6524149275404897, "explanation": "The records do not identify the same system: Record A is about CBP\u2019s Automated Commercial Environment (ACE), a trade-processing and data-sharing platform for import documentation, while Record B is an AI use case for anomaly detection on cargo images. However, they are plausibly connected because AC"}, {"source": "pra:201906-1651-005", "target": "inv:DHS-37", "edge_type": "related", "similarity": 0.6523882063645305, "explanation": "Record A is about CBP\u2019s Automated Commercial Environment (ACE), a customs/trade processing platform that shares records with other CBP systems and specifically feeds data to ATS and other systems; it is not itself an image-analysis AI system. Record B describes \"Automated Item of Interest Detection,"}, {"source": "pra:201605-1651-004", "target": "inv:DHS-2364", "edge_type": "related", "similarity": 0.6523712038191236, "explanation": "The records do not identify the same system by name or official identifier: Record A is the CBP Automated Commercial Environment / Centralized Examination Station context, while Record B is an AI use case for Anomaly Detection Homogenous Cargo. On subject and function, Record A describes ACE as a co"}]};

const REGIME_COLOR = { sorn: "#5b9cf6", pra: "#f6955b", inv: "#5bf685" };
const REGIME_LABEL = { sorn: "SORN", pra: "PRA", inv: "Inventory" };

const svg = d3.select("#canvas");
const W = () => window.innerWidth, H = () => window.innerHeight;

const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.08, 8]).on("zoom", e => g.attr("transform", e.transform)));

const tooltip = document.getElementById("tooltip");
const simSlider = document.getElementById("sim-slider");
const simVal = document.getElementById("sim-val");
const hideRelated = document.getElementById("hide-related");
const edgeCounts = document.getElementById("edge-counts");

let linkSel, nodeSel, sim;

function visibleEdges() {
  const minSim = +simSlider.value;
  const noRelated = hideRelated.checked;
  return GRAPH.links.filter(e => {
    if (e.similarity !== null && e.similarity < minSim) return false;
    if (noRelated && e.edge_type === "related") return false;
    return true;
  });
}

function visibleNodes(edges) {
  const seen = new Set(GRAPH.nodes.filter(n => n.is_seed).map(n => n.id));
  edges.forEach(e => { seen.add(e.source.id ?? e.source); seen.add(e.target.id ?? e.target); });
  return GRAPH.nodes.filter(n => seen.has(n.id));
}

function draw() {
  g.selectAll("*").remove();
  svg.selectAll("defs").remove();
  if (sim) sim.stop();

  const edges = visibleEdges();
  const nodes = visibleNodes(edges);
  edgeCounts.textContent = "link: " + edges.filter(e => e.edge_type === "link").length
    + ", dep: " + edges.filter(e => e.edge_type === "related").length;

  const nodeData = nodes.map(n => Object.assign({}, n));
  const nodeMap = Object.fromEntries(nodeData.map(n => [n.id, n]));

  const edgeData = edges.map(e => Object.assign({}, e, {
    source: nodeMap[e.source.id != null ? e.source.id : e.source] ?? e.source,
    target: nodeMap[e.target.id != null ? e.target.id : e.target] ?? e.target,
  }));

  const defs = svg.append("defs");
  ["link", "related"].forEach(t => {
    defs.append("marker")
      .attr("id", "arr-" + t).attr("viewBox", "0 -4 8 8")
      .attr("refX", 18).attr("refY", 0)
      .attr("markerWidth", 5).attr("markerHeight", 5)
      .attr("orient", "auto")
      .append("path").attr("d", "M0,-4L8,0L0,4")
      .attr("fill", t === "link" ? "#7eb8f7" : "#f7b67e")
      .attr("fill-opacity", t === "link" ? 0.8 : 0.4);
  });

  linkSel = g.append("g").selectAll("line")
    .data(edgeData).join("line")
    .attr("class", d => "link-" + d.edge_type)
    .attr("stroke-width", d => d.edge_type === "link" ? 1.8 : 0.9)
    .attr("marker-end", d => "url(#arr-" + d.edge_type + ")")
    .on("mouseenter", (event, d) => {
      const src = d.source.id != null ? d.source.id : d.source;
      const tgt = d.target.id != null ? d.target.id : d.target;
      const sim_str = d.similarity !== null ? (+d.similarity).toFixed(3) : "n/a";
      showTooltip(event,
        "<strong>" + src + " → " + tgt + "</strong>\n"
        + "type: " + d.edge_type + "  |  similarity: " + sim_str + "\n\n"
        + (d.explanation || ""));
    })
    .on("mousemove", moveTooltip)
    .on("mouseleave", hideTooltip);

  nodeSel = g.append("g").selectAll("g")
    .data(nodeData).join("g")
    .attr("class", d => "node" + (d.is_seed ? " seed" : ""))
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end",   (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on("mouseenter", (event, d) => {
      showTooltip(event,
        "<strong>" + d.id + "</strong>\n"
        + "regime: " + (REGIME_LABEL[d.regime] || d.regime)
        + (d.is_seed ? "\n[seed record]" : ""));
    })
    .on("mousemove", moveTooltip)
    .on("mouseleave", hideTooltip);

  nodeSel.append("circle")
    .attr("r", d => d.is_seed ? 10 : 6)
    .attr("fill", d => REGIME_COLOR[d.regime] || "#aaa")
    .attr("fill-opacity", d => d.is_seed ? 1 : 0.75);

  nodeSel.append("text")
    .attr("dy", d => d.is_seed ? -13 : -9)
    .attr("text-anchor", "middle")
    .text(d => d.id.split(":").slice(1).join(":"));

  sim = d3.forceSimulation(nodeData)
    .force("link", d3.forceLink(edgeData).id(d => d.id)
      .distance(d => d.edge_type === "link" ? 90 : 140)
      .strength(d => d.edge_type === "link" ? 0.6 : 0.15))
    .force("charge", d3.forceManyBody().strength(-220))
    .force("center", d3.forceCenter(W() / 2, H() / 2))
    .force("collision", d3.forceCollide(14))
    .on("tick", () => {
      linkSel
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      nodeSel.attr("transform", d => "translate(" + d.x + "," + d.y + ")");
    });
}

function showTooltip(event, html) {
  tooltip.style.display = "block";
  tooltip.innerHTML = html;
  moveTooltip(event);
}
function moveTooltip(event) {
  let x = event.clientX + 16, y = event.clientY + 16;
  if (x + 380 > W()) x = event.clientX - 380;
  if (y + 200 > H()) y = event.clientY - 200;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

simSlider.addEventListener("input", () => {
  simVal.textContent = (+simSlider.value).toFixed(2);
  draw();
});
hideRelated.addEventListener("change", draw);
window.addEventListener("resize", draw);

draw();
</script>
</body>
</html>
