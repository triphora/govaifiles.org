buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.3.1'
		classpath 'org.flywaydb:flyway-gradle-plugin:11.20.2'
		classpath 'org.jooq:jooq-codegen-gradle:3.20.10'
		classpath libs.flyway.postgresql
	}
}

plugins {
	id 'java'
	id 'application'
}

apply plugin: 'com.gradleup.shadow'
apply plugin: 'org.flywaydb.flyway'
apply plugin: 'org.jooq.jooq-codegen-gradle'

sourceSets {
	generated
}

tasks.jooqCodegen.dependsOn tasks.flywayMigrate
tasks.compileGeneratedJava.dependsOn tasks.jooqCodegen
tasks.shadowJar.dependsOn tasks.compileGeneratedJava

repositories {
	mavenCentral()
}

def dotenvFile = file('../.env')
def dotenv = [:]

if (dotenvFile.exists()) {
	dotenvFile.eachLine { line ->
		def trimmed = line.trim()
		if (!trimmed.isEmpty() && !trimmed.startsWith('#')) {
			def idx = trimmed.indexOf('=')
			if (idx > 0) {
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				dotenv[key] = value
			}
		}
	}
}

def envValue = { key -> System.getenv(key) ?: dotenv[key] }

dependencies {
	implementation libs.bundles.implementation
	generatedImplementation libs.bundles.generatedImplementation
	jooqCodegen libs.postgresql

	implementation sourceSets.generated.output
}

def dbCredentials = [
		url: 'jdbc:' + envValue('POSTGRES_URL'),
		user: envValue('POSTGRES_USER'),
		password: envValue('POSTGRES_PASSWORD'),
]

jooq {
	configuration {
		jdbc {
			driver = 'org.postgresql.Driver'
			url = dbCredentials['url']
			user = dbCredentials['user']
			password = dbCredentials['password']
		}
		generator {
			database {
				name = 'org.jooq.meta.postgres.PostgresDatabase'
				includes = '.*'
				inputSchema = 'public'
			}
			target {
				packageName = 'org.govaifiles.api.generated.db'
				directory = sourceSets.generated.java.getSrcDirs()[0]
			}
		}
	}
}

flyway {
	url = dbCredentials['url']
	user = dbCredentials['user']
	password = dbCredentials['password']
	schemas = ['public']
	locations = ['filesystem:src/main/resources/db/migrations']
	baselineOnMigrate = true
}

application {
	mainClass = 'org.govaifiles.api.Main'
}

jar {
	manifest {
		attributes(
				'Main-Class': application.mainClass
		)
	}
}

