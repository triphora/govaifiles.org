[versions]
shadow = '9.3.1'
dotenv-gradle = '4.0.0'
flyway = '11.20.2'

gson = '2.13.2'
javalin = '6.7.0'
jooq = '3.20.10'
typesense-java = '1.3.0'
slf4j = '2.0.17'
dotenv-java = '3.2.0'
postgresql = '42.7.2'

[libraries]
typesense-java = { module = 'org.typesense:typesense-java', version.ref = 'typesense-java' }
slf4j-simple = { module = 'org.slf4j:slf4j-simple', version.ref = 'slf4j' }
dotenv = { module = 'io.github.cdimascio:dotenv-java', version.ref = 'dotenv-java' }
gson = { module = 'com.google.code.gson:gson', version.ref = 'gson' }
javalin = { module = 'io.javalin:javalin', version.ref = 'javalin' }
jooq = { module = 'org.jooq:jooq', version.ref = 'jooq' }
jooq-meta = { module = 'org.jooq:jooq-meta', version.ref = 'jooq' }
jooq-codegen = { module = 'org.jooq:jooq-codegen', version.ref = 'jooq' }
postgresql = { module = 'org.postgresql:postgresql', version.ref = 'postgresql' }
flyway-postgresql = { module = 'org.flywaydb:flyway-database-postgresql', version.ref = 'flyway' }

[bundles]
implementation = [
	'typesense-java', 'slf4j-simple', 'dotenv',
	'gson', 'javalin',
	'jooq', 'jooq-meta', 'jooq-codegen', 'postgresql',
	'flyway-postgresql',
]
generatedImplementation = [
	'jooq', 'jooq-meta', 'jooq-codegen', 'postgresql',
]

[plugins]
shadow = { id = 'com.gradleup.shadow', version.ref = 'shadow' }
dotenv = { id = 'co.uzzu.dotenv.gradle', version.ref = 'dotenv-gradle' }
flyway = { id = 'org.flywaydb.flyway', version.ref = 'flyway' }
jooq-codegen-gradle = { id = 'org.jooq.jooq-codegen-gradle', version.ref = 'jooq' }
